services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moyu
      POSTGRES_USER: moyu
      POSTGRES_PASSWORD: moyu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moyu -d moyu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
